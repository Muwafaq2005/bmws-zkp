services:
  node1:
    image: hyperledger/besu:24.1.0
    container_name: bwms-besu-node1
    environment:
      - BESU_LOGGING=INFO
    volumes:
      - ./genesis.json:/etc/besu/genesis.json
      - ./key1:/etc/besu/key1
    command:
      - --genesis-file=/etc/besu/genesis.json
      - --network-id=1337
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,QBFT,WEB3,TXPOOL
      - --rpc-http-cors-origins=*
      - --host-allowlist=*
      - --miner-enabled=true
      - --miner-coinbase=0xb5fbc69cb05deb0de2f016aa354ee2d31bd0ace2
      - --node-private-key-file=/etc/besu/key1
      - --min-gas-price=0
      - --p2p-enabled=false
    ports:
      - "8545:8545"

  node2:
    image: hyperledger/besu:24.1.0
    container_name: bwms-besu-node2
    volumes:
      - ./genesis.json:/etc/besu/genesis.json
    command:
      - --genesis-file=/etc/besu/genesis.json
      - --network-id=1337
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8546
      - --rpc-http-api=ETH,NET,QBFT,WEB3,TXPOOL
      - --rpc-http-cors-origins=*
      - --host-allowlist=*
      - --min-gas-price=0
    ports:
      - "8546:8546"

  node3:
    image: hyperledger/besu:24.1.0
    container_name: bwms-besu-node3
    volumes:
      - ./genesis.json:/etc/besu/genesis.json
    command:
      - --genesis-file=/etc/besu/genesis.json
      - --network-id=1337
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8547
      - --rpc-http-api=ETH,NET,QBFT,WEB3,TXPOOL
      - --rpc-http-cors-origins=*
      - --host-allowlist=*
      - --min-gas-price=0
    ports:
      - "8547:8547"

  node4:
    image: hyperledger/besu:24.1.0
